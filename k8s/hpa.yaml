apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: datascribe-pro
  namespace: datascribe
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: datascribe-pro
  minReplicas: 2
  maxReplicas: 20
  metrics:
    # Scale on CPU — LLM calls are CPU-light but lots of I/O; keep threshold moderate
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Scale on memory — NetworkX graphs per session can accumulate
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60      # wait 1 min before scaling up again
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300     # wait 5 min before scaling down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
