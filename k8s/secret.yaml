# Secret template — fill in base64-encoded values before applying.
# Generate with:  echo -n "your-value" | base64
#
# Do NOT commit real secrets to git.
# In production use External Secrets Operator with AWS Secrets Manager,
# Azure Key Vault, or HashiCorp Vault instead of this file.
apiVersion: v1
kind: Secret
metadata:
  name: datascribe-secrets
  namespace: datascribe
type: Opaque
data:
  # ── Option A: OpenAI ─────────────────────────────────────────────────────────
  OPENAI_API_KEY: <base64-encoded-value>

  # ── Option B: Azure OpenAI ───────────────────────────────────────────────────
  # AZURE_OPENAI_API_KEY:  <base64-encoded-value>
  # AZURE_OPENAI_ENDPOINT: <base64-encoded-value>

  # ── Option C: AWS Bedrock — prefer IAM role (no keys needed on EKS) ──────────
  # AWS_ACCESS_KEY_ID:     <base64-encoded-value>
  # AWS_SECRET_ACCESS_KEY: <base64-encoded-value>

  # ── Database ─────────────────────────────────────────────────────────────────
  DATABASE_URL: <base64-encoded-value>
