apiVersion: v1
kind: Service
metadata:
  name: datascribe-pro
  namespace: datascribe
  labels:
    app: datascribe-pro
spec:
  selector:
    app: datascribe-pro
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
# Ingress — requires an ingress controller (nginx, ALB, etc.)
# Adjust host and annotations for your cloud provider.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: datascribe-pro
  namespace: datascribe
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Required for WebSocket upgrade
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  ingressClassName: nginx
  rules:
    - host: datascribe.example.com    # replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: datascribe-pro
                port:
                  number: 80
  # tls:
  #   - hosts:
  #       - datascribe.example.com
  #     secretName: datascribe-tls
